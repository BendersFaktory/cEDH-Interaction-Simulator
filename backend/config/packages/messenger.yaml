framework:
    messenger:
        transports:
            # Worker : php bin/console messenger:consume async (voir docs/SYMFONY_SETUP.md)
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    auto_setup: false
                retry_strategy:
                    max_retries: 0
        routing:
            'App\Message\RunSimulation': async

when@test:
    framework:
        messenger:
            transports:
                async: 'sync://'
